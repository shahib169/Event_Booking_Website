<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Events - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-white shadow p-4 mb-6">
    <div class="flex justify-between items-center max-w-6xl mx-auto">
      <div class="flex items-center gap-6 text-xl font-bold">
        <a href="events.html" class="text-blue-600 hover:underline">Events</a>
        <a href="map.html" class="text-blue-600 hover:underline">Map View</a>
        <a href="friends.html" class="text-blue-600 hover:underline">Friends</a>

      </div>
            <div class="relative inline-block text-left">
        <button id="profile-button" class="flex items-center space-x-2 text-blue-600 hover:underline focus:outline-none">
          <div id="profile-avatar" class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-semibold"></div>
          <span id="profile-label">User</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white border rounded shadow-lg z-50">
          <a href="bookmarks.html" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">Bookmarks</a>
          <a href="preferences.html" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">Preferences</a>
          <button id="logout-button" class="w-full text-left px-4 py-2 text-gray-800 hover:bg-gray-100">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <h2 class="text-xl font-semibold mb-4">Search Events by City</h2>
    <form id="search-form" class="mb-8 flex flex-wrap gap-2">
      <input type="text" id="city-input" class="flex-1 p-2 border rounded" placeholder="Enter city (e.g. London)" required />
      <select id="genre-input" class="p-2 border rounded">
        <option value="">All Genres</option>
        <option value="KZFzniwnSyZfZ7v7nJ">Music</option>
        <option value="KZFzniwnSyZfZ7v7nE">Sports</option>
        <option value="KZFzniwnSyZfZ7v7na">Arts & Theatre</option>
        <option value="KZFzniwnSyZfZ7v7nn">Film</option>
      </select>
      <input type="date" id="start-date" class="p-2 border rounded" />
      <input type="date" id="end-date" class="p-2 border rounded" />
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Search</button>
    </form>

    <section id="suggested-section" class="mb-10 p-4 bg-blue-50 border border-blue-200 rounded-lg">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-blue-700 flex items-center gap-2">
          🎯 Suggested for You
        </h2>
        <span class="text-sm text-blue-500">Based on your preferences</span>
      </div>
      <div id="suggested-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>
    <section id="ai-matches-section" class="mb-10 p-4 bg-green-50 border border-green-200 rounded-lg">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-green-700 flex items-center gap-2">More you might like!</h2>
        <span class="text-sm text-green-600">Smart suggestions just for you</span>
      </div>
      <div id="ai-matches-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>
    

    <hr class="border-t border-gray-300 mb-8">

    <div id="event-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, collection, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
      authDomain: "website-a1862.firebaseapp.com",
      projectId: "website-a1862",
      storageBucket: "website-a1862.firebasestorage.app",
      messagingSenderId: "1039428075573",
      appId: "1:1039428075573:web:2026ad869ccfe56495317c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const searchForm = document.getElementById("search-form");
    const cityInput = document.getElementById("city-input");
    const eventContainer = document.getElementById("event-list");
    const suggestedContainer = document.getElementById("suggested-list");

    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "index.html");

      const uid = user.uid;
      const profileLabel = document.getElementById("profile-label");
      const profileAvatar = document.getElementById("profile-avatar");
      const name = user.displayName || user.email || "User";
      profileLabel.textContent = name.split("@")[0];
      profileAvatar.textContent = name.charAt(0).toUpperCase();

      const profileButton = document.getElementById("profile-button");
      const dropdown = document.getElementById("profile-dropdown");
      profileButton.addEventListener("click", () => dropdown.classList.toggle("hidden"));
      document.addEventListener("click", (e) => {
        if (!profileButton.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.add("hidden");
      });
      document.getElementById("logout-button").addEventListener("click", () => {
        auth.signOut().then(() => window.location.href = "index.html");
      });

      async function renderEvents(events, container, limit = null) {
        container.innerHTML = "";
        const shown = limit ? events.slice(0, limit) : events;

        if (!shown.length) {
          container.innerHTML = '<p class="text-gray-500">No events found.</p>';
          return;
        }

        shown.forEach(event => {
          const isCustom = event._isCustom || false;
          const safeTitle = event.title || event.name || "untitled";
        const eventId = event.id || safeTitle.replace(/\s+/g, "-");

          const card = document.createElement("div");
          card.className = "bg-white p-4 rounded shadow flex flex-col justify-between";

          const image = event.images?.[0]?.url || event.image || "";
          const date = event.dates?.start?.localDate || event.date || "";
          const name = event.name || event.title || "Unnamed Event";
          const venue = event._embedded?.venues?.[0]?.name || event.venue || "";
          const link = event.url || "#";

          card.innerHTML = `
            <img src="${image}" alt="${name}" class="w-full h-40 object-cover mb-3 rounded">
            <h3 class="text-lg font-bold mb-1">${name}</h3>
            <p class="text-sm text-gray-600 mb-2">${date} at ${venue}</p>
            ${isCustom ? '<span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded mb-2">🔥 Brand New</span>' : ""}
            <div class="flex justify-between items-center mt-auto gap-2">
            <a href="${link}" target="_blank" class="text-sm text-blue-600 underline">View</a>
            <button class="bookmark-btn text-red-500 text-xl" title="Save to bookmarks">❤</button>
            <a href="reviews.html?eventId=${encodeURIComponent(eventId)}&name=${encodeURIComponent(name)}" class="text-sm text-purple-600 underline">Reviews</a>
          </div>

            <form class="review-form mt-4">
              <input type="text" placeholder="Write a review..." class="w-full border rounded p-2 mb-2 review-text" />
              <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 text-sm">Submit Review</button>
            </form>
          `;

          card.querySelector(".bookmark-btn").addEventListener("click", async () => {
            try {
              await setDoc(doc(db, `users/${uid}/bookmarks/${eventId}`), {
                title: name,
                date: date,
                venue: venue,
                image: image,
                url: link
              });
              alert("Bookmarked!");
            } catch (err) {
              console.error("Failed to save bookmark:", err);
              alert("Could not save bookmark.");
            }
          });

          card.querySelector(".review-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = card.querySelector(".review-text");
            const reviewText = input.value.trim();
            if (!reviewText) return;

            try {
              await addDoc(collection(db, `reviews/${eventId}/entries`), {
                uid,
                text: reviewText,
                timestamp: serverTimestamp()
              });
              input.value = "";
              alert("Review submitted!");
            } catch (err) {
              console.error("Failed to submit review:", err);
              alert("Could not submit review.");
            }
          });

          container.appendChild(card);
        });
      }

      async function fetchEvents(city = "", genre = "", startDate = "", endDate = "") {
        const cities = city ? [city] : ["London", "Manchester", "Birmingham", "Glasgow", "Leeds"];
        let allEvents = [];

        try {
          for (const c of cities) {
            let url = `https://us-central1-website-a1862.cloudfunctions.net/getEvents?city=${encodeURIComponent(c)}`;
            if (genre) url += `&classificationId=${genre}`;
            if (startDate) url += `&startDateTime=${startDate}T00:00:00Z`;
            if (endDate) url += `&endDateTime=${endDate}T23:59:59Z`;

            const res = await fetch(url);
            const data = await res.json();
            const events = data._embedded?.events || [];
            allEvents.push(...events);
          }

          const snap = await getDocs(collection(db, "events_custom"));
          snap.forEach(docSnap => {
            const ev = docSnap.data();
            ev._isCustom = true;
            allEvents.push(ev);
          });

          const seen = new Set();
          const unique = allEvents.filter(e => {
            const id = e.id || e.title;
            if (seen.has(id)) return false;
            seen.add(id);
            return true;
          });

          const shuffled = unique.sort(() => 0.5 - Math.random());
          renderEvents(shuffled, eventContainer);
        } catch (err) {
          console.error("Fetch failed:", err);
          eventContainer.innerHTML = '<p class="text-red-500">Error loading events.</p>';
        }
      }

      async function loadSuggestedEvents(preferences = []) {
        const section = document.getElementById("suggested-section");
        if (!preferences.length) {
          section.style.display = "none";
          return;
        }

        section.style.display = "block";
        suggestedContainer.innerHTML = "";

        const cities = ["London", "Manchester", "Birmingham", "Glasgow", "Leeds"];
        const allSuggested = [];
        const seenNames = new Set();

        for (const genre of preferences) {
          for (const city of cities) {
            try {
              const url = `https://us-central1-website-a1862.cloudfunctions.net/getEvents?city=${encodeURIComponent(city)}&classificationId=${genre}`;
              const res = await fetch(url);
              const data = await res.json();
              const events = data._embedded?.events || [];

              for (const event of events) {
                const nameKey = event.name.toLowerCase().trim();
                if (!seenNames.has(nameKey)) {
                  seenNames.add(nameKey);
                  allSuggested.push(event);
                }
                if (allSuggested.length >= 6) break;
              }

              if (allSuggested.length >= 6) break;
            } catch (err) {
              console.error(`Error loading suggested events for ${genre} in ${city}:`, err);
            }
          }

          if (allSuggested.length >= 6) break;
        }

        const finalSuggestions = allSuggested.sort(() => 0.5 - Math.random()).slice(0, 3);
        renderEvents(finalSuggestions, suggestedContainer);
      }

      async function loadAIMatches(userPreferences) {
        const aiSection = document.getElementById("ai-matches-section");
        const aiList = document.getElementById("ai-matches-list");

        if (!userPreferences.length) {
          aiSection.style.display = "none";
          return;
        }

        aiSection.style.display = "block";
        aiList.innerHTML = "";

        try {
          const events = [];
          const cities = ["London", "Manchester", "Birmingham", "Glasgow", "Leeds"];

          for (const city of cities) {
            for (const genre of userPreferences) {
              const url = `https://us-central1-website-a1862.cloudfunctions.net/getEvents?city=${encodeURIComponent(city)}&classificationId=${genre}`;
              const res = await fetch(url);
              const data = await res.json();
              events.push(...(data._embedded?.events || []));
            }
          }

          const unique = [];
          const names = new Set();
          for (const event of events) {
            const key = event.name?.toLowerCase().trim();
            if (key && !names.has(key)) {
              names.add(key);
              unique.push(event);
            }
          }

          const shuffled = unique.sort(() => 0.5 - Math.random()).slice(0, 6);
          renderEvents(shuffled, aiList);

        } catch (err) {
          console.error("Failed to load AI matches:", err);
          aiList.innerHTML = '<p class="text-red-500">Error loading AI matches.</p>';
        }
      }


      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const city = cityInput.value.trim();
        const genre = document.getElementById("genre-input").value;
        const start = document.getElementById("start-date").value;
        const end = document.getElementById("end-date").value;
        fetchEvents(city, genre, start, end);
      });

      fetchEvents();
      const userDoc = await getDoc(doc(db, "users", uid));
      const prefs = userDoc.data()?.preferences || [];
      loadSuggestedEvents(prefs);
      loadAIMatches(prefs);
    });
  </script>
</body>
</html>
