<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded shadow max-w-sm w-full">
    <h1 class="text-2xl font-bold mb-6 text-center">Register</h1>
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium">Full Name</label>
        <input type="text" class="w-full p-2 border rounded" required placeholder="John Doe" />
      </div>
      <div>
        <label class="block text-sm font-medium">Email</label>
        <input type="email" class="w-full p-2 border rounded" required placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium">Password</label>
        <input type="password" class="w-full p-2 border rounded" required placeholder="••••••••" />
      </div>
      <div>
        <label class="block text-sm font-medium">Confirm Password</label>
        <input type="password" class="w-full p-2 border rounded" required placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Register</button>
    </form>
    <p class="text-sm text-center mt-4">
      Already have an account? <a href="index.html" class="text-blue-600 underline">Login</a>
    </p>
  </div>

  <!-- Firebase Auth + Firestore for Roles -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    
const firebaseConfig = {
  apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
  authDomain: "website-a1862.firebaseapp.com",
  projectId: "website-a1862",
  storageBucket: "website-a1862.firebasestorage.app",
  messagingSenderId: "1039428075573",
  appId: "1:1039428075573:web:2026ad869ccfe56495317c"
};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.querySelector('form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const [nameInput, emailInput, passInput, confirmInput] = form.querySelectorAll('input');

      if (passInput.value !== confirmInput.value) {
        return alert('Passwords do not match');
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
        const uid = userCredential.user.uid;

        await setDoc(doc(db, "users", uid), {
          name: nameInput.value,
          email: emailInput.value,
          role: "customer"
        });

        alert('Registration successful!');
        window.location.href = 'events.html';
      } catch (err) {
        alert(`Registration failed: ${err.message}`);
      }
    });
  </script>
</body>
</html>
