<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Friend Activity - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-white shadow p-4 mb-6">
    <div class="flex justify-between items-center max-w-6xl mx-auto">
      <div class="flex items-center gap-6 text-xl font-bold">
        <a href="events.html" class="text-blue-600 hover:underline">Events</a>
        <a href="map.html" class="text-blue-600 hover:underline">Map View</a>
        <a href="friends.html" class="text-blue-900 underline">Friends</a>
      </div>
      <button id="logout-button" class="text-red-600 hover:underline">Logout</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <section class="mb-10">
      <h2 class="text-xl font-semibold mb-4">Add or Remove Friends</h2>
      <input id="search-input" type="text" placeholder="Search by name or email..." class="border p-2 rounded w-full mb-4" />
      <div id="search-results" class="space-y-2 mb-6"></div>
      <h3 class="text-lg font-semibold mb-2">Your Friends</h3>
      <ul id="friend-list" class="space-y-2 mb-8"></ul>
    </section>

    <h1 class="text-2xl font-bold mb-6">👥 Friend Activity</h1>
    <div id="friend-activity-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, doc, setDoc, deleteDoc, getDoc, onSnapshot, query, where
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    

    const firebaseConfig = {
      apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
      authDomain: "website-a1862.firebaseapp.com",
      projectId: "website-a1862",
      storageBucket: "website-a1862.firebasestorage.app",
      messagingSenderId: "1039428075573",
      appId: "1:1039428075573:web:2026ad869ccfe56495317c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    const friendList = document.getElementById("friend-list");
    const activityContainer = document.getElementById("friend-activity-list");

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "index.html";
      const uid = user.uid;

      document.getElementById("logout-button").addEventListener("click", () => {
        auth.signOut().then(() => window.location.href = "index.html");
      });

      // Load friends
      const friendsSnap = await getDocs(collection(db, `users/${uid}/friends`));
      if (!friendsSnap.empty) {
        friendList.innerHTML = "";
        for (const friendDoc of friendsSnap.docs) {
          const friendId = friendDoc.id;
          const friendName = friendDoc.data().name || "Friend";

          const li = document.createElement("li");
          li.className = "bg-white p-2 rounded shadow flex justify-between items-center";

          // Real-time status
          const statusRef = doc(db, "users", friendId);
          onSnapshot(statusRef, (docSnap) => {
            const status = docSnap.data()?.status === "online" ? "🟢 Online" : "⚪️ Offline";
            li.querySelector(".status").textContent = status;
          });

          li.innerHTML = `
            <span>${friendName} <span class="status text-sm text-gray-500"></span></span>
            <button class="text-red-500 text-sm underline remove-btn">Remove</button>
          `;

          li.querySelector(".remove-btn").addEventListener("click", async () => {
            await deleteDoc(doc(db, `users/${uid}/friends/${friendId}`));
            li.remove();
          });

          friendList.appendChild(li);
        }
      }

      // Search users to add
      searchInput.addEventListener("input", async (e) => {
        const term = e.target.value.trim().toLowerCase();
        results.innerHTML = "";

        if (!term) return;

        const usersSnap = await getDocs(collection(db, "users"));
        usersSnap.forEach(docSnap => {
            const data = docSnap.data();
            const displayName = (data.name || "").toLowerCase();
            const displayEmail = (data.email || "").toLowerCase();

            if (displayName.includes(term) || displayEmail.includes(term)) {
            const userId = docSnap.id;
            if (userId === auth.currentUser.uid) return; // skip self

            const result = document.createElement("div");
            result.className = "flex justify-between items-center bg-white p-3 rounded shadow";
            result.innerHTML = `
                <div>
                <p class="font-medium">${data.name || "No Name"}</p>
                <p class="text-sm text-gray-600">${data.email || ""}</p>
                </div>
                <button class="add-friend-btn text-blue-600 hover:underline" data-id="${userId}" data-name="${data.name || "Friend"}">Add</button>
            `;
            results.appendChild(result);
            }
        });
        });

      // Load friend activity
      try {
        if (friendsSnap.empty) {
          activityContainer.innerHTML = '<p class="text-gray-500">You have no friends added yet.</p>';
          return;
        }

        const allActivities = [];

        for (const friendDoc of friendsSnap.docs) {
          const friendId = friendDoc.id;
          const friendName = friendDoc.data().name || "A friend";

          const bookmarksSnap = await getDocs(collection(db, `users/${friendId}/bookmarks`));
          bookmarksSnap.forEach(docSnap => {
            const data = docSnap.data();
            allActivities.push({
              type: "bookmark",
              friend: friendName,
              ...data
            });
          });
        }

        if (allActivities.length === 0) {
          activityContainer.innerHTML = '<p class="text-gray-500">No friend activity yet.</p>';
          return;
        }

        allActivities.forEach(item => {
          const card = document.createElement("div");
          card.className = "bg-white p-4 rounded shadow";

          card.innerHTML = `
            <h3 class="text-lg font-bold mb-1">${item.title}</h3>
            <p class="text-sm text-gray-600 mb-1">${item.date} at ${item.venue}</p>
            <p class="text-sm">💬 ${item.friend} bookmarked this</p>
            <a href="${item.url}" target="_blank" class="text-blue-600 underline text-sm">View Event</a>
            <button class="mt-2 text-sm text-green-600 underline share-btn" data-title="${item.title}" data-url="${item.url}">Share</button>
          `;

          card.querySelector(".share-btn").addEventListener("click", (e) => {
            const title = e.target.dataset.title;
            const url = e.target.dataset.url;
            const subject = `Check out this event: ${title}`;
            const body = `Thought you'd like this: ${url}`;
            window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
          });

          activityContainer.appendChild(card);
        });

      } catch (err) {
        console.error("Error loading friend activity:", err);
        activityContainer.innerHTML = '<p class="text-red-500">Failed to load friend activity.</p>';
      }
    });
  </script>
</body>
</html>
