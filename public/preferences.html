<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preferences - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-white shadow p-4 mb-6">
    <div class="flex justify-between items-center max-w-6xl mx-auto">
      <div class="flex items-center gap-6 text-xl font-bold">
        <a href="events.html" class="text-blue-600 hover:underline">Events</a>
        <a href="map.html" class="text-blue-600 hover:underline">Map View</a>
        <a href="friends.html" class="text-blue-600 hover:underline">Friends</a>
      </div>
      <div class="relative inline-block text-left">
        <button id="profile-button" class="flex items-center space-x-2 text-blue-600 hover:underline focus:outline-none">
          <div id="profile-avatar" class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-semibold"></div>
          <span id="profile-label">User</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white border rounded shadow-lg z-50">
          <a href="bookmarks.html" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">Bookmarks</a>
          <a href="preferences.html" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">Preferences</a>
          <a href="notifications.html" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">Notifications</a>
          <button id="logout-button" class="w-full text-left px-4 py-2 text-gray-800 hover:bg-gray-100">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-6">⚙️ Preferences</h1>

    <section class="mb-6">
      <h2 class="text-xl font-semibold mb-2">Notification Preferences</h2>
      <label class="inline-flex items-center">
        <input type="checkbox" id="email-opt-in" class="form-checkbox h-5 w-5 text-blue-600" />
        <span class="ml-2 text-gray-700">Receive email notifications</span>
      </label>
    </section>

    <section class="mb-6">
      <h2 class="text-xl font-semibold mb-2">Event Interests</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
        <label class="inline-flex items-center">
          <input type="checkbox" class="genre-checkbox" value="KZFzniwnSyZfZ7v7nJ" />
          <span class="ml-2">Music</span>
        </label>
        <label class="inline-flex items-center">
          <input type="checkbox" class="genre-checkbox" value="KZFzniwnSyZfZ7v7nE" />
          <span class="ml-2">Sports</span>
        </label>
        <label class="inline-flex items-center">
          <input type="checkbox" class="genre-checkbox" value="KZFzniwnSyZfZ7v7na" />
          <span class="ml-2">Arts & Theatre</span>
        </label>
        <label class="inline-flex items-center">
          <input type="checkbox" class="genre-checkbox" value="KZFzniwnSyZfZ7v7nn" />
          <span class="ml-2">Film</span>
        </label>
      </div>
    </section>

    <section class="mb-6">
      <h2 class="text-xl font-semibold mb-2">Default Location</h2>
      <select id="default-location" class="w-full border border-gray-300 p-2 rounded">
        <option value="">Select your default city</option>
        <option value="London">London</option>
        <option value="Manchester">Manchester</option>
        <option value="Birmingham">Birmingham</option>
        <option value="Glasgow">Glasgow</option>
        <option value="Leeds">Leeds</option>
        <option value="Liverpool">Liverpool</option>
        <option value="Edinburgh">Edinburgh</option>
        <option value="Cardiff">Cardiff</option>
        <option value="Bristol">Bristol</option>
        <option value="Sheffield">Sheffield</option>
      </select>
    </section>

    <div class="mt-8">
      <button id="save-preferences" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Apply Changes
      </button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
      authDomain: "website-a1862.firebaseapp.com",
      projectId: "website-a1862",
      storageBucket: "website-a1862.firebasestorage.app",
      messagingSenderId: "1039428075573",
      appId: "1:1039428075573:web:2026ad869ccfe56495317c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "index.html";

      const profileLabel = document.getElementById("profile-label");
      const profileAvatar = document.getElementById("profile-avatar");
      const name = user.displayName || user.email || "User";
      profileLabel.textContent = name.split("@")[0];
      profileAvatar.textContent = name.charAt(0).toUpperCase();

      const profileButton = document.getElementById("profile-button");
      const dropdown = document.getElementById("profile-dropdown");
      profileButton.addEventListener("click", () => dropdown.classList.toggle("hidden"));
      document.addEventListener("click", (e) => {
        if (!profileButton.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.add("hidden");
      });

      document.getElementById("logout-button").addEventListener("click", () => {
        auth.signOut().then(() => window.location.href = "index.html");
      });

      const emailOptCheckbox = document.getElementById("email-opt-in");
      const defaultLocationSelect = document.getElementById("default-location");
      const genreCheckboxes = document.querySelectorAll(".genre-checkbox");
      const saveBtn = document.getElementById("save-preferences");
      const userRef = doc(db, "users", user.uid);

      const snap = await getDoc(userRef);
      if (snap.exists()) {
        const data = snap.data();
        emailOptCheckbox.checked = data.emailOptIn ?? true;
        defaultLocationSelect.value = data.defaultLocation || "";
        const savedPrefs = data.preferences || [];
        genreCheckboxes.forEach(cb => cb.checked = savedPrefs.includes(cb.value));
      }

      saveBtn.addEventListener("click", async () => {
        const selectedGenres = Array.from(genreCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        const updatedData = {
          emailOptIn: emailOptCheckbox.checked,
          preferences: selectedGenres,
          defaultLocation: defaultLocationSelect.value
        };

        await setDoc(userRef, updatedData, { merge: true });
        alert("Preferences saved!");
      });
    });
  </script>
</body>
</html>
