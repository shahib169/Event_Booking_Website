<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map View - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>#map { height: 80vh; }</style>
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-white shadow p-4 mb-4">
    <div class="flex justify-between items-center max-w-6xl mx-auto">
      <div class="flex items-center gap-6 text-xl font-bold">
        <a href="events.html" class="text-blue-600 hover:underline">Events</a>
        <span class="text-blue-900 underline">Map View</span>
      </div>
      <button id="logout-button" class="text-red-600 hover:underline">Logout</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <div class="mb-4">
      <label for="radius" class="mr-2 font-medium">Show events within</label>
      <select id="radius" class="border p-2 rounded">
        <option value="10">10 miles</option>
        <option value="25">25 miles</option>
        <option value="50">50 miles</option>
        <option value="100">100 miles</option>
      </select>
    </div>
    <div id="map" class="rounded shadow"></div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
      authDomain: "website-a1862.firebaseapp.com",
      projectId: "website-a1862",
      storageBucket: "website-a1862.firebasestorage.app",
      messagingSenderId: "1039428075573",
      appId: "1:1039428075573:web:2026ad869ccfe56495317c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const map = L.map('map').setView([51.505, -0.09], 6);
    const radiusSelect = document.getElementById("radius");

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const apiKey = "dojeaFaTHVOWAk2owQzuiElRVjpdUQiT";

    // Distance calculation
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * Math.PI / 180;
      const R = 3958.8; // radius in miles
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function loadCustomEvents(userLat, userLng, radiusMiles) {
      const snap = await getDocs(collection(db, "events_custom"));
      snap.forEach(doc => {
        const data = doc.data();
        const { latitude, longitude, title, city, url } = data;
        if (latitude && longitude) {
          const dist = haversineDistance(userLat, userLng, latitude, longitude);
          if (dist <= radiusMiles) {
            L.marker([latitude, longitude]).addTo(map)
              .bindPopup(`<strong>${title}</strong><br>${city}<br><a href="${url}" target="_blank" class="text-blue-600 underline">View</a>`);
          }
        }
      });
    }

    async function loadTicketmasterEvents(userLat, userLng, radiusMiles) {
      const url = `https://app.ticketmaster.com/discovery/v2/events.json?latlong=${userLat},${userLng}&radius=${radiusMiles}&unit=miles&countryCode=GB&size=100&apikey=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const events = data._embedded?.events || [];

        events.forEach(ev => {
          const venue = ev._embedded?.venues?.[0];
          const lat = parseFloat(venue?.location?.latitude);
          const lng = parseFloat(venue?.location?.longitude);

          if (lat && lng) {
            L.marker([lat, lng]).addTo(map)
              .bindPopup(`<strong>${ev.name}</strong><br>${venue.name}<br><a href="${ev.url}" target="_blank" class="text-blue-600 underline">View</a>`);
          }
        });

        console.log("🎯 Ticketmaster events found:", events.length);
      } catch (err) {
        console.error("Failed to load Ticketmaster events:", err);
      }
    }

    function loadAllEvents(userLat, userLng) {
      const radius = parseInt(radiusSelect.value);
      map.eachLayer(layer => {
        if (layer instanceof L.Marker) map.removeLayer(layer);
      });

      // Show user location again
      L.marker([userLat, userLng]).addTo(map)
        .bindPopup("📍 You are here").openPopup();

      loadCustomEvents(userLat, userLng, radius);
      loadTicketmasterEvents(userLat, userLng, radius);
    }
    function sendNotification(userId, message) {
  const db = firebase.firestore();
  
  db.collection("users").doc(userId).collection("notifications").add({
    message: message,
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    read: false
  }).then(() => {
    console.log("Notification sent successfully.");
  }).catch((error) => {
    console.error("Error sending notification: ", error);
  });
}

  </script>
</body>
</html>
