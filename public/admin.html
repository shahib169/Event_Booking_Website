<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Event Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-white shadow p-4 mb-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Admin Dashboard</h1>
      <a href="create-event.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Create Event</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <h2 class="text-xl font-semibold mb-4">Your Events</h2>
    <div id="event-list" class="grid md:grid-cols-2 gap-4">
      <!-- Events will be loaded here -->
    </div>
  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    
const firebaseConfig = {
  apiKey: "AIzaSyCyBdL6d2jDhWqXrIVAHpZfhFnxVq-J11I",
  authDomain: "website-a1862.firebaseapp.com",
  projectId: "website-a1862",
  storageBucket: "website-a1862.firebasestorage.app",
  messagingSenderId: "1039428075573",
  appId: "1:1039428075573:web:2026ad869ccfe56495317c"
};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const eventList = document.getElementById("event-list");

    async function loadEvents() {
      const querySnapshot = await getDocs(collection(db, "events"));
      querySnapshot.forEach((doc) => {
        const event = doc.data();
        const div = document.createElement("div");
        div.className = "bg-white p-4 rounded shadow";
        div.innerHTML = `
          <h3 class="text-lg font-bold">${event.title}</h3>
          <p>${event.date} - ${event.location}</p>
        `;
        eventList.appendChild(div);
      });
    }

    loadEvents();
  </script>
</body>
</html>
